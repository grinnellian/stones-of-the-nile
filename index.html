<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stones of the Nile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      color: #e0d5c1;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* --- 3D background --- */
    #pyramid-3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    /* --- UI overlay --- */
    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }

    #ui-overlay > * { pointer-events: auto; }

    /* --- Top bar --- */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(22, 33, 62, 0.85);
      border-bottom: 1px solid rgba(58, 58, 94, 0.6);
      backdrop-filter: blur(8px);
      flex-wrap: wrap;
    }

    .top-bar .title {
      color: #c9a85c;
      font-size: 1.1em;
      font-weight: bold;
      margin-right: 12px;
    }

    .top-bar .date-display {
      font-size: 0.85em;
      margin-right: auto;
    }

    /* --- Panels container --- */
    .panels-area {
      flex: 1;
      display: flex;
      padding: 12px;
      gap: 12px;
      overflow: hidden;
      pointer-events: none;
    }

    .panels-area > * { pointer-events: auto; }

    /* Left sidebar */
    .sidebar-left {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 320px;
      min-width: 280px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #3a3a5e transparent;
    }

    /* Right sidebar */
    .sidebar-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 320px;
      min-width: 280px;
      margin-left: auto;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #3a3a5e transparent;
    }

    /* --- Panel --- */
    .panel {
      background: rgba(22, 33, 62, 0.88);
      border: 1px solid rgba(58, 58, 94, 0.6);
      border-radius: 6px;
      backdrop-filter: blur(8px);
      overflow: hidden;
      flex-shrink: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid rgba(58, 58, 94, 0.4);
    }

    .panel-header:hover { background: rgba(58, 58, 94, 0.3); }

    .panel-header h2 {
      color: #c9a85c;
      font-size: 0.95em;
      margin: 0;
      border: none;
      padding: 0;
    }

    .panel-toggle {
      color: #8b7d6b;
      font-size: 0.8em;
      transition: transform 0.2s;
    }

    .panel.collapsed .panel-toggle { transform: rotate(-90deg); }
    .panel.collapsed .panel-body { display: none; }

    .panel-body {
      padding: 8px 12px 10px;
    }

    /* --- Bottom bar (log) --- */
    .bottom-bar {
      background: rgba(22, 33, 62, 0.88);
      border-top: 1px solid rgba(58, 58, 94, 0.6);
      backdrop-filter: blur(8px);
      max-height: 160px;
      overflow: hidden;
      transition: max-height 0.3s;
    }

    .bottom-bar.collapsed { max-height: 32px; }

    .bottom-bar .panel-header {
      border-bottom: 1px solid rgba(58, 58, 94, 0.4);
      padding: 6px 16px;
    }

    .log {
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.75em;
      line-height: 1.4;
      padding: 6px 16px 8px;
      scrollbar-width: thin;
      scrollbar-color: #3a3a5e transparent;
    }

    /* --- Buttons --- */
    button {
      background: #c9a85c;
      color: #1a1a2e;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.8em;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #dbb96e; }
    button:disabled { background: #5a5a5e; color: #8a8a8e; cursor: default; }
    button.danger { background: #8b4049; color: #e0d5c1; }
    button.danger:hover { background: #a34d58; }
    button.btn-sm { padding: 3px 8px; font-size: 0.75em; }

    /* --- Data display --- */
    .resource-row {
      display: flex;
      justify-content: space-between;
      padding: 1px 0;
      font-size: 0.8em;
    }
    .resource-name { color: #a0a0c0; }
    .resource-qty { color: #e0d5c1; font-weight: bold; }
    .resource-qty.zero { color: #5a5a5e; }

    .season-indicator {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 0.8em;
    }
    .season-akhet { background: #1e3a5f; color: #6db3f2; }
    .season-peret { background: #2d4a1e; color: #8fc35a; }
    .season-shemu { background: #5a3a1e; color: #e8a83e; }

    .flood-bar {
      height: 6px;
      background: #3a3a5e;
      border-radius: 3px;
      margin-top: 3px;
      overflow: hidden;
    }
    .flood-fill {
      height: 100%;
      background: #4a8fe8;
      border-radius: 3px;
      transition: width 0.3s;
    }

    .contract-status {
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.75em;
      font-weight: bold;
    }
    .status-active { background: #2d4a1e; color: #8fc35a; }
    .status-completed { background: #1e3a5f; color: #6db3f2; }
    .status-failed { background: #5a1e1e; color: #e85a5a; }

    .progress-bar {
      display: flex;
      gap: 2px;
      margin-top: 3px;
    }
    .progress-pip {
      width: 16px;
      height: 10px;
      border-radius: 2px;
      background: #3a3a5e;
    }
    .progress-pip.fulfilled { background: #8fc35a; }
    .progress-pip.missed { background: #e85a5a; }

    .speed-label { color: #8b7d6b; font-size: 0.8em; }
    .site-name { color: #c9a85c; font-weight: bold; font-size: 0.85em; }
    .producer-status { font-size: 0.75em; color: #a0a0c0; }
    .producer-active { color: #8fc35a; }
    .producer-idle { color: #e85a5a; }

    .log-entry { padding: 1px 0; }
    .log-production { color: #8fc35a; }
    .log-transport { color: #6db3f2; }
    .log-contract { color: #c9a85c; }
    .log-season { color: #e8a83e; font-weight: bold; }

    .site-separator {
      border-top: 1px solid rgba(58, 58, 94, 0.4);
      margin: 6px 0;
    }
  </style>
</head>
<body>
  <div id="pyramid-3d"></div>
  <div id="ui-overlay"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
